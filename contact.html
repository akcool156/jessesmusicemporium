<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Jesses Music Emporium</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html">
                     <img href="index.html" class="logoImg" src="Images/jmLogo.svg" alt="Jesses Music Emporium Logo">
                </a>
            </div>
            <div class="title">
                <h1 class="titleText">Jesses Music Emporium</h1>
            </div>
            <div class="nav">
                <a class="instrumentsBTN" href="instruments.html">Instruments</a>
                <a class="contactBTN" href="contact.html">Contact</a>
            </div>
        </div>
    </header>
    


    
    <div class="FormBox">
        <form class="FORM" action="https://formspree.io/f/xvkopepl" method="post">
            <h1 class="FORMtitle">Jesses Music Emporium Contact Form</h1>
            <input class="FORMname" type="text" name="Name" placeholder="Enter Name" autocomplete="off" required>
            <input class="FORMsurname "type="text" name="Surname" placeholder="Enter Surname" autocomplete="off" required>
            <input class="FORMemail" type="text" name="Email" placeholder="Enter Email" autocomplete="off" required>
            <textarea class="FORMmsg" rows="5" cols="60" name="message" placeholder="Enter Message" autocomplete="off" required></textarea>
            <button class="FORMsbmt" type="submit">Submit Form</button>
        </form>
    </div>




    <footer>
        <div class="UpperAreaFooter">
            <div class="FooterBlurb">
                <h4 class="FooterBlurbText">
                    Jesses Music Emproum is an instrument rental store with a large variety of high quality instruments that you can easily and cheaply rent.
                </h4>
            </div>
            <div class="PageLinks">
                <a href="contact.html" class="ContactFooter">Contact</a>
                <a href="instruments.html" class="InstrumentsFooter">Instruments</a>
                <a href="aboutus.html" class="AboutusFooter">AboutUs</a>
            </div>
        </div>
        <div class="LowerAreaFooter">
            <div class="SocialIcons">
                <h3 class="SocialLinksText">Social Links: </h3>
                <a href="https://www.facebook.com/" aria-label="Facebook">
                    <i class="fa-brands fa-facebook"></i>
                </a>
                <a href="https://www.instagram.com/" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://www.youtube.com/" aria-label="Youtube">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </div>
            <div class="Copyright">
                <h4 class="copyrightText">&copy; JessesMusicEmporium</h4>
            </div>
        </div>
    </footer>
</body>
</html>
